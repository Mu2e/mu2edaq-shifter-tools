[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mu2edaq-shifter-tools"
version = "1.1.0"
description = "Operator utilities for running the Mu2e DAQ system"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Mu2e DAQ Group" }]
keywords = ["mu2e", "daq", "otsdaq", "fermilab", "shifter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.9",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: System :: Monitoring",
]

# Kept deliberately small. PyQt is optional so the package installs on
# headless DAQ nodes; see the "gui" extra.
dependencies = [
    "PyYAML>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
gui = ["PyQt5>=5.15"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/Mu2e/mu2edaq-shifter-tools"
Repository = "https://github.com/Mu2e/mu2edaq-shifter-tools"

[project.scripts]
daq-read-config = "mu2edaq_shifter_tools.read_config:main"
daq-open-tunnels = "mu2edaq_shifter_tools.open_tunnels:main"
daq-cluster-cp = "mu2edaq_shifter_tools.cluster_cp:main"
daq-ls2json = "mu2edaq_shifter_tools.ls2json:main"
daq-install-tools = "mu2edaq_shifter_tools.install_daq_tools:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
